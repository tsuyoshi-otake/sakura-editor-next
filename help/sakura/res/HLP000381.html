<h2>Markdown プレビューを表示／非表示</h2>
Markdown ファイル（.md、.markdown、.mdown、.mkd）の右側に、ネイティブのプレビューを表示します。<br>
<br>
既定のキー割り当ては Ctrl+Shift+V です。プレビューはファイルを編集した後、少し待ってから更新されます。<br>
<br>
この初期実装では、ATX 見出し、段落、箇条書き、番号付きリスト、引用、コードフェンス、水平線、およびリンクの表示に対応しています。<br>
リンクは表示のみで、プレビューから開くことはできません。HTML、表、画像、拡張 Markdown 記法は表示対象外です。<br>
