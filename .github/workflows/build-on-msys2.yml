name: MinGW Build and Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,read
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_NUGET_OWNER: ${{ github.repository_owner }}
  VCPKG_ROOT: ${{ github.workspace }}\tools\vcpkg

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  mingw:
    runs-on: windows-latest
    # The vendored Windows Terminal subset currently requires MSVC/WIL/Windows SDK ETW support.
    # Keep MinGW running for diagnostics, but treat this documented experimental build as advisory.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # A pull request builds Release only; a trusted push to main and a manual
        # dispatch keep both configurations. MinGW is an advisory portability
        # signal, and one configuration already reveals a construct GCC rejects
        # -- the required MSVC matrix owns Debug/Release coverage. Running both
        # legs on every pull request cost 38 of the roughly 74 runner-minutes a
        # pull request spent, none of it a required status check (#164).
        configuration: ${{ github.event_name == 'pull_request' && fromJSON('["Release"]') || fromJSON('["Debug", "Release"]') }}
    env:
      BuildPlatform: MinGW
      Configuration: ${{ matrix.configuration }}
      # MinGW links the one native Rust staticlib and compiles the candidate
      # paths, but its production providers stay C++: the provider guard in
      # src/main/cmake/sakura.cmake is fatal for any other value here (#303).
      # Pin the selector so no Rust backend arrives from the caller or from the
      # runner environment.
      SAKURA_UTF16_BACKEND: cpp

    defaults:
      run:
        shell: msys2 {0} # 指定しない限りmsys2シェルを使う

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # src/test/headless-suite-selection.env is the one definition of which
      # suites a hosted runner can actually execute; this job used to carry a
      # hand-copied duplicate of build-sakura.yml's list with a comment asking
      # the next editor to keep the two equal by hand (#164).  pwsh rather than
      # the job's msys2 default shell, because appending to the Windows
      # $GITHUB_ENV path from an MSYS2 shell is the known-bad path this
      # repository already avoids for $GITHUB_OUTPUT.
      - name: Apply the shared headless suite selection
        shell: pwsh
        run: Get-Content src/test/headless-suite-selection.env | Add-Content -Path $env:GITHUB_ENV

      - name: Install OpenCppCoverage (winget)
        if: ${{ env.Configuration == 'Debug' }}
        run: |
          winget install `
            --id OpenCppCoverage.OpenCppCoverage `
            --exact `
            --accept-package-agreements `
            --accept-source-agreements
        shell: pwsh

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-iconv
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python
            mingw-w64-x86_64-uv
            mingw-w64-x86_64-7zip
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-ctags
            mingw-w64-x86_64-diffutils

      # rustup ships with the runner image, but the release this repository
      # builds against is declared by rust/native/rust-toolchain.toml, which the
      # MSVC gate reads the same way. Add the GNU target so the one native
      # staticlib exists for the MinGW link (#303). The toolchain is installed
      # per run rather than cached: the MSVC gate does the same, and this
      # workflow already owns the largest entry in the repository's shared cache
      # quota.
      - name: Prepare the pinned Rust toolchain for the GNU target
        shell: pwsh
        working-directory: rust/native
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchainDocument = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          $channelMatches = [regex]::Matches(
            $toolchainDocument,
            '(?m)^\s*channel\s*=\s*"([^"]+)"\s*$'
          )
          if ($channelMatches.Count -ne 1) {
            throw 'rust-toolchain.toml must declare exactly one channel.'
          }
          $pin = $channelMatches[0].Groups[1].Value
          if ($pin -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "rust-toolchain.toml channel must be an exact numeric release, not a moving alias: $pin"
          }

          rustup toolchain install $pin --profile minimal --target x86_64-pc-windows-gnu --no-self-update
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Rust toolchain installation failed with exit code $LASTEXITCODE."
          }

          $activeToolchain = (rustup show active-toolchain).Trim()
          if (-not $activeToolchain.StartsWith(
            "$pin-",
            [StringComparison]::Ordinal
          )) {
            throw "rust-toolchain.toml did not select ${pin}: $activeToolchain"
          }
          rustc "+$pin" --target x86_64-pc-windows-gnu --print target-libdir
          if ($LASTEXITCODE -ne 0) {
            throw "The pinned toolchain has no x86_64-pc-windows-gnu standard library."
          }

          $cargo = (Get-Command cargo -CommandType Application | Select-Object -First 1).Source
          if (-not $cargo) {
            throw 'cargo is not on PATH after installing the pinned toolchain.'
          }
          "SAKURA_CARGO_BIN=$(Split-Path -Parent $cargo)" >> $env:GITHUB_ENV

      - run: uv venv

      - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

      - name: Show environment variables for debug
        run: env

      - name: Bootstrap vcpkg
        run: ./bootstrap-vcpkg.sh -disableMetrics
        working-directory: ${{ env.VCPKG_ROOT }}

      - name: Configure GitHub Packages for vcpkg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          $nuget = & $vcpkg fetch nuget

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget)) {
              throw "Failed to obtain nuget.exe."
          }

          & $nuget sources remove `
              -Name GitHubPackages `
              -NonInteractive 2>$null

          & $nuget sources add `
              -Name GitHubPackages `
              -Source "$env:VCPKG_NUGET_FEED" `
              -UserName "$env:VCPKG_NUGET_OWNER" `
              -Password "$env:GITHUB_TOKEN" `
              -StorePasswordInClearText `
              -NonInteractive

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to add the GitHub Packages NuGet source."
          }

      - name: Build with MinGW-w64-gcc
        # The msys2 shell keeps a minimal PATH so MSYS2 build-tool resolution
        # stays deterministic. Name Cargo's proxy directory on its own rather
        # than inheriting the whole Windows PATH, so CMake's find_program
        # resolves the cargo the step above pinned.
        run: |
          export PATH="$(cygpath --unix "${SAKURA_CARGO_BIN}"):${PATH}"
          ./build-gnu.bat ${{ env.BuildPlatform }} ${{ env.Configuration }} --no-test

      - name: Run unit tests
        id: run_unit_tests
        timeout-minutes: 15
        # The pytest contract suite invokes the runner-provided git,
        # powershell.exe, and pwsh.exe directly. Keep the broader Windows PATH
        # scoped to this test step so MSYS2 build-tool resolution stays
        # deterministic while those host executables remain observable. The
        # pinned Cargo proxy still leads that PATH, so the reconfigure this
        # step performs resolves the same cargo the build did.
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          export PATH="$(cygpath --unix "${SAKURA_CARGO_BIN}"):${PATH}"
          ./build-gnu.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}

      - name: Try gdb backtrace on test failure
        if: failure() && env.Configuration == 'Debug'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/${{ env.BuildPlatform }}/${{ env.Configuration }}
        run: |
          set -eo pipefail
          echo "Run gdb trace for: tests1.exe"
          gdb -batch \
            -ex "set pagination off" \
            -ex "run" \
            -ex "bt" \
            -ex "bt full" \
            -ex "info registers" \
            --args ./tests1.exe --gtest_repeat=100 --gtest_throw_on_failure

      - name: Clean up test process survivors
        if: ${{ always() }}
        shell: pwsh
        run: .\tools\Cleanup-TestProcessSurvivors.ps1
