name: build sakura

# Run push builds on the protected integration and release branches.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit to package.
        required: true
        type: string
      release_tag:
        description: Canonical release tag for the immutable source commit.
        required: true
        type: string
      release_promotion:
        description: Build only the Release packaging path for an already tested release source.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:

defaults:
  run:
    shell: pwsh # 指定しない限りpwshを使う

env:
  CI_ACCOUNT_NAME: ${{ github.actor }}
  CI_REPO_NAME: ${{ github.repository }}
  CI_BUILD_VERSION: ${{ github.run_id }}
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  CHECKOUT_REF: ${{ inputs.source_sha || github.sha }}
  GITHUB_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.source_sha || github.sha }}
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,read
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_NUGET_OWNER: ${{ github.repository_owner }}
  VCPKG_ROOT: ${{ github.workspace }}\tools\vcpkg

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-encoding:
    runs-on: &windows_runner windows-2022 # VS 2022 + Windows SDK 10.0.22621.0
    defaults:
      run:
        shell: cmd # このJobでは 指定しない限り cmd を使う
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # check_encoding.py validates the event-provided base SHA

      - name: Show environment variables for debug
        run: set

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true

      - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt
          
      - name: Python version check
        run: python --version

      - name: Python compile check before install
        run: python -m compileall -f .

      - name: Check encoding
        env:
          # A release promotion has already validated the main-push gate for
          # its immutable source SHA. It must not reinterpret the caller's tag
          # push `before` value as a source-code diff.
          CHECK_ENCODING_BASE_SHA: ${{ inputs.release_promotion && '0000000000000000000000000000000000000000' || github.event.pull_request.base.sha || github.event.before || '' }}
        run: checkEncoding.bat

  # 拡張ホストは Node で動くので、C++ のビルドとは独立して検証できる。
  # vcpkg も MSBuild も要らない軽量ジョブとして先に回し、拡張ホストの退行を
  # 重いビルドの完走を待たずに落とす。
  test-exthost:
    name: Test extension host
    runs-on: *windows_runner
    needs: check-encoding
    # The release promotion validates this immutable SHA's required main gate
    # before it invokes packaging, so avoid re-running its independent Node job.
    if: ${{ !inputs.release_promotion }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ vars.NODE_VERSION || '22.x' }}

    # 拡張ホストは依存パッケージを持たない (package.json に dependencies なし)。
    # npm ci を呼ぶとロックファイルが無いので失敗する。install は行わない。
    - name: Node version check
      run: node --version

    # バンドルは MSBuild からも生成されるが、ここで単独に通しておくと
    # bundler の壊れ方が C++ ビルドのログに埋もれない。
    - name: Build extension host bundle
      run: npm --prefix src/exthost run build

    - name: Verify bundle output
      run: |
        $bundle = 'src/exthost/dist/extension-host.js'
        if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
          throw "extension host bundle was not produced at $bundle"
        }
        Write-Host "bundle size: $((Get-Item -LiteralPath $bundle).Length) bytes"

    # node --test は既定でタイムアウトを持たない。ハングしたテストが
    # ランナーの時間を食い潰さないよう、明示的に上限を与える。
    - name: Run extension host tests
      run: npm --prefix src/exthost test -- --test-timeout=60000

    # テストコマンドが返ったことは、テストプロセスが終わったことの証明にならない。
    - name: Clean up test process survivors
      if: ${{ always() }}
      run: .\tools\Cleanup-TestProcessSurvivors.ps1

  build-vcpkg-msvc:
    name: Build vcpkg (MSVC)
    runs-on: *windows_runner
    needs: check-encoding

    env:
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

    permissions:
      contents: read
      packages: write

    steps:
    ## see https://github.com/actions/checkout
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1  # 過去の履歴は含めず取得
        submodules: true

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        activate-environment: true

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

    - name: Bootstrap vcpkg
      run: |
        if (-not (Test-Path ".\bootstrap-vcpkg.bat" -PathType Leaf)) {
            throw ".\bootstrap-vcpkg.bat not found."
        }

        & .\bootstrap-vcpkg.bat -disableMetrics

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg (exit code: $LASTEXITCODE)."
        }
      working-directory: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget -PathType Leaf)) {
            throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to add the GitHub Packages NuGet source."
        }

    - name: vcpkg install (x64-windows-static)
      run: |
        & "${{ env.VCPKG_ROOT }}\vcpkg.exe" install `
          --triplet x64-windows-static `
          --clean-after-build

  build-vcpkg-mingw:
    name: Build vcpkg (MinGW)
    runs-on: *windows_runner
    needs: check-encoding
    # MinGW is experimental and advisory; it must not block the MSVC gate.
    continue-on-error: true
    # Release promotion intentionally consumes the tested MSVC source path;
    # MinGW remains advisory and is not repeated before publication.
    if: ${{ !inputs.release_promotion }}

    env:
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-iconv
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-python
          mingw-w64-x86_64-uv
          mingw-w64-x86_64-7zip
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-ctags
          mingw-w64-x86_64-diffutils

    - run: uv venv
      shell: msys2 {0}

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt
      shell: msys2 {0}

    - name: Bootstrap vcpkg
      run: |
        if (-not (Test-Path ".\bootstrap-vcpkg.bat" -PathType Leaf)) {
          throw ".\bootstrap-vcpkg.bat not found."
        }

        & .\bootstrap-vcpkg.bat -disableMetrics

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to bootstrap vcpkg (exit code: $LASTEXITCODE)."
        }
      working-directory: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget -PathType Leaf)) {
          throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to add the GitHub Packages NuGet source."
        }

    - name: vcpkg install (x64-mingw-static)
      run: |
        & "${{ env.VCPKG_ROOT }}\vcpkg.exe" install `
          --triplet x64-mingw-static `
          --clean-after-build

  build-chm:
    name: Build CHM
    runs-on: *windows_runner
    needs: check-encoding
    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1
        submodules: true

    # HHC.exeを実行するためにMsBuildが必要
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    # LEProc.exeをインストールするためにAutoHotKeyが必要
    - name: Install AutoHotKey
      run: |
        $AutohotkeyDir = "$HOME\autohotkey"
        if (!(Test-Path $AutohotkeyDir)) { New-Item -ItemType Directory -Path $AutohotkeyDir }
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip -OutFile "AutoHotkey.zip"
        Expand-Archive -Path "AutoHotkey.zip" -DestinationPath $AutohotkeyDir -Force
        echo "AutoHotKey=$HOME\autohotkey\AutoHotkey32.exe" >> $env:GITHUB_ENV

    # HHC.exeを実行するためにLEProc.exeが必要
    - name: Install Locale Emulator
      run: |
        $LEExpandDir = "${{ github.workspace }}\tools\LocaleEmulator"
        $LEInitScript = "${{ github.workspace }}\tools\LocaleEmulator\init-locale-emulator.ahk"
        Expand-Archive "${{ github.workspace }}\externals\LocaleEmulator\locale-emulator.zip" "${LEExpandDir}"
        Start-Process $env:AutoHotKey "${LEInitScript}"
        Start-Process "${LEExpandDir}\LEInstaller.exe"
        echo "${LEExpandDir}" >> $env:GITHUB_PATH

    # HHC.exeを使ってHTMLヘルプをコンパイルする
    - name: Build HTML Help
      run: build-chm.bat
      shell: cmd

    # コンパイルしたHTMLヘルプをartifactにする
    - name: Upload CHM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-chm-artifacts
        path: |
          help/**/*.chm
          help/**/Compile.log
        if-no-files-found: error

  build-bmp-tools:
    name: Build BmpTools
    runs-on: *windows_runner
    needs: check-encoding
    if: ${{ github.event_name != 'pull_request' && !inputs.release_promotion }}

    strategy:
      matrix:
        config:
          - Debug
          - Release

    steps:
    ## see https://github.com/actions/checkout
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1  # 過去の履歴は含めず取得
        submodules: true

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Bootstrap vcpkg
      run: .\bootstrap-vcpkg.bat -disableMetrics
      working-directory: ${{ env.VCPKG_ROOT }}
      shell: cmd

    # Toolbar Bitmap Split/Mux
    - name: Build Bitmap Split/Mux
      run: build-bmp-tools.bat ${{ matrix.config }}
      shell: cmd

  build:
    # The type of runner that the job will run on
    name: MSBuild
    runs-on: *windows_runner
    needs: [build-vcpkg-msvc, build-chm]
    if: ${{ !cancelled() }}

    strategy:
      matrix:
        # A release promotion already validates the source's Debug/Release
        # main gate. It re-runs only the Release package/test path at a fixed
        # source SHA; ordinary CI continues to cover both configurations.
        config: ${{ inputs.release_promotion && fromJSON('["Release"]') || fromJSON('["Debug", "Release"]') }}
        platform:
          - x64

    # SAKURA_GENERATE_ASSEMBLY_LISTINGS also serializes LTCG codegen
    # (/CGTHREADS:1). pull_request Release builds never publish the Asm
    # artifact, so leave it off there; push/workflow_dispatch Release builds
    # keep it on for the published Asm zip. Job-level (not step-level) so
    # zipArtifacts.bat and the Upload Asm step below see the same value the
    # MSBuild step used.
    env:
      SAKURA_GENERATE_ASSEMBLY_LISTINGS: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' && '1' || '0' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Validate build prerequisites
      env:
        VCPKG_MSVC_RESULT: ${{ needs.build-vcpkg-msvc.result }}
        BUILD_CHM_RESULT: ${{ needs.build-chm.result }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        $expectedChmResult = if ($env:EVENT_NAME -eq 'pull_request') { 'skipped' } else { 'success' }
        if ($env:VCPKG_MSVC_RESULT -ne 'success' -or $env:BUILD_CHM_RESULT -ne $expectedChmResult) {
          throw "Build prerequisites are not ready: build-vcpkg-msvc=$env:VCPKG_MSVC_RESULT, build-chm=$env:BUILD_CHM_RESULT, expected build-chm=$expectedChmResult."
        }

    ## see https://github.com/actions/checkout
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 0
        submodules: true

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    # SonarQubeのBuild Wrapperをインストールする
    - name: Install Build Wrapper
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Debug' }}
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

    # OpenCppCoverageをハッシュ検証済みのインストーラーから導入する。
    - name: Install OpenCppCoverage
      if: ${{ matrix.config == 'Debug' }}
      working-directory: ${{ runner.temp }}
      run: |
        $installer = '.\OpenCppCoverageSetup.exe'
        Invoke-WebRequest `
          -Uri "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe" `
          -OutFile $installer
        $expectedSha256 = '2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888'
        $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256.ToLowerInvariant()) {
          throw "SHA256 mismatch: expected=$expectedSha256 actual=$actualSha256"
        }
        $process = Start-Process `
          -FilePath $installer `
          -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" `
          -Wait `
          -PassThru
        if ($process.ExitCode -ne 0) {
          throw "OpenCppCoverage installer failed with exit code $($process.ExitCode)."
        }
        echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

    - name: Install Ctags (Chocolatey)
      run: choco install universal-ctags --version=2022.6.5 --yes --no-progress

    - name: Install DiffUtils (Chocolatey)
      run: choco install diffutils --version=2.8.7 --yes --no-progress

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        activate-environment: true

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

    - name: Copy github-event.json
      run: |
        Copy-Item "$env:GITHUB_EVENT_PATH" github-event.json

    - name: Generate sonar metadata
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Debug' }}
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        [ordered]@{
          event_name  = '${{ github.event_name }}'
          ref_name    = '${{ github.ref_name }}'
          pr_number   = '${{ github.event.pull_request.number }}'
          pr_head_ref = $env:PR_HEAD_REF
          pr_base_ref = $env:PR_BASE_REF
        } | ConvertTo-Json | Set-Content sonar-metadata.json

    - name: Setup PR environment variables
      if: github.event_name == 'pull_request'
      run: |
        echo "GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_URL=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_COMMIT=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_SHORT_COMMIT=$('${{ github.event.pull_request.head.sha }}'.SubString(0, 8))" >> $env:GITHUB_ENV

    - name: Bootstrap vcpkg
      run: |
        if (-not (Test-Path ".\bootstrap-vcpkg.bat" -PathType Leaf)) {
            throw ".\bootstrap-vcpkg.bat not found."
        }

        & .\bootstrap-vcpkg.bat -disableMetrics

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg (exit code: $LASTEXITCODE)."
        }
      working-directory: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget)) {
            throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to add the GitHub Packages NuGet source."
        }

    - name: Build with Build-Wrapper
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Debug' }}
      run: build-wrapper-win-x86-64.exe --out-dir bw-output MsBuild.exe /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.config }}

    - name: MSBuild
      if: ${{ !(matrix.platform == 'x64' && matrix.config == 'Debug') }}
      run: build-sln.bat ${{ matrix.platform }} ${{ matrix.config }}
      shell: cmd

    - name: Restore CHM artifacts
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/download-artifact@v8
      with:
        name: build-chm-artifacts
        path: help

    # The full native suite opens real windows and is not reliable in a
    # non-interactive hosted-runner session. Keep those tests available for
    # interactive validation and run the documented headless suite in CI.
    - name: Run headless tests
      timeout-minutes: 15
      env:
        GTEST_FILTER: >-
          -MacroMgrTest.*:CPpaTest.*:SelectFileTest.*:FileDialog/FileDialogTest.*:CDlgProfileMgrTest.*:TrayWndTest.*:EditWndTest.*:WinMainFuncTest.*:WinMain/WinMainTest.*
      run: ctest
        --test-dir build/${{ matrix.platform }}/CMakeTools
        -C ${{ matrix.config }}
        --output-on-failure
        --timeout 600
        -V

    - name: Clean up test process survivors
      if: ${{ always() }}
      run: .\tools\Cleanup-TestProcessSurvivors.ps1

    # Lightweight release-only verification; this does not schedule another clean build.
    - name: Verify release build provenance
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Release' }}
      run: .\tools\verify-build-incremental.ps1 -ValidateImportedFiles

    - name: Upload sonar-input artifact
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Debug' }}
      uses: actions/upload-artifact@v7
      with:
        name: sonar-input
        path: |
          bw-output/
          tests*-coverage.xml
          tests*-googletest.xml
          pytest-coverage.xml
          sonar-metadata.json
          github-event.json

    - name: Build installer with Inno Setup
      if: ${{ github.event_name != 'pull_request' }}
      run: build-installer.bat ${{ matrix.platform }} ${{ matrix.config }}
      shell: cmd

    - name: zipArtifacts
      run: zipArtifacts.bat ${{ matrix.platform }} ${{ matrix.config }}
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd

    # The package workspace intentionally contains the immutable release source,
    # which can predate this workflow and therefore cannot supply its own
    # promotion helper. Keep the helper at the trusted workflow revision and in
    # a separate directory so it cannot affect the packaged source tree.
    - name: Checkout release provenance helper
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 1
        path: release-orchestration

    - name: Record release provenance
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: >-
        .\release-orchestration\.github\scripts\Write-ReleaseProvenance.ps1
        -SourceSha "${{ inputs.source_sha }}"
        -ReleaseTag "$env:RELEASE_TAG"
        -OutputPath release-provenance.json

    - name: Upload release provenance
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      with:
        name: Release provenance ${{ matrix.platform }} ${{ matrix.config }}
        path: release-provenance.json
        if-no-files-found: error

    ## see https://github.com/actions/upload-artifact
    - name: Upload Installer
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Installer ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Installer.zip'

    - name: Upload Exe
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Exe ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Exe.zip'

    - name: Upload Log
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Log ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Log.zip'

    - name: Upload Asm
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && env.SAKURA_GENERATE_ASSEMBLY_LISTINGS == '1' }}
      with:
        name: Asm ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Asm.zip'

    - name: Upload Dev
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Dev ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Dev.zip'
