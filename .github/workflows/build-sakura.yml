name: build sakura

# Pull requests verify changes entering main; push builds refresh main after merge.
on:
  workflow_call:
    inputs:
      ci_plan_provided:
        description: Whether a trusted caller supplied the pull-request CI plan.
        required: false
        default: false
        type: boolean
      ci_mode:
        description: Terminal CI planner mode supplied by the pull-request gate.
        required: false
        default: full_native
        type: string
      run_native_build:
        description: Whether the supplied CI plan selected native Windows work.
        required: false
        default: true
        type: boolean
      source_sha:
        description: Immutable source commit to package.
        required: true
        type: string
      release_tag:
        description: Canonical release tag for the immutable source commit.
        required: true
        type: string
      release_promotion:
        description: Build only the Release packaging path for an already tested release source.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches:
      - main

defaults:
  run:
    shell: pwsh # 指定しない限りpwshを使う

env:
  CI_ACCOUNT_NAME: ${{ github.actor }}
  CI_REPO_NAME: ${{ github.repository }}
  CI_BUILD_VERSION: ${{ github.run_id }}
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # github.sha names the caller/workflow revision for reusable workflows. Keep
  # the source that is actually checked out available to version.cmake as a
  # separate, non-reserved variable.
  SAKURA_BUILD_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  CHECKOUT_REF: ${{ inputs.source_sha || github.sha }}
  GITHUB_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.source_sha || github.sha }}
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,read
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_NUGET_OWNER: ${{ github.repository_owner }}
  VCPKG_ROOT: ${{ github.workspace }}\tools\vcpkg

permissions:
  actions: read
  contents: read

concurrency:
  group: build-sakura-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-encoding:
    runs-on: &windows_runner windows-2022 # VS 2022 + Windows SDK 10.0.22621.0
    defaults:
      run:
        shell: cmd # このJobでは 指定しない限り cmd を使う
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # The encoding checker validates the event-provided base SHA

      - name: Show environment variables for debug
        run: set

      - name: Check encoding
        env:
          # A release promotion has already validated the main-push gate for
          # its immutable source SHA. It must not reinterpret the caller's tag
          # push `before` value as a source-code diff.
          CHECK_ENCODING_BASE_SHA: ${{ inputs.release_promotion && '0000000000000000000000000000000000000000' || github.event.pull_request.base.sha || github.event.before || '' }}
        run: checkEncoding.bat

  build-vcpkg-msvc:
    name: Build vcpkg (MSVC)
    runs-on: *windows_runner
    needs: check-encoding
    if: ${{ github.event_name != 'pull_request' || inputs.run_native_build }}
    env:
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

    permissions:
      contents: read
      packages: write

    steps:
    ## see https://github.com/actions/checkout
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1  # 過去の履歴は含めず取得
        submodules: true

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        activate-environment: true

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg
      with:
        vcpkg-root: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget -PathType Leaf)) {
            throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to add the GitHub Packages NuGet source."
        }

    - name: vcpkg install (x64-windows-static)
      run: |
        & "${{ env.VCPKG_ROOT }}\vcpkg.exe" install `
          --triplet x64-windows-static `
          --clean-after-build

  build-vcpkg-mingw:
    name: Build vcpkg (MinGW)
    runs-on: *windows_runner
    needs: check-encoding
    # MinGW is experimental and advisory; it must not block the MSVC gate.
    continue-on-error: true
    # Release promotion intentionally consumes the tested MSVC source path;
    # MinGW remains advisory and is not repeated before publication.
    if: ${{ !inputs.release_promotion && (github.event_name != 'pull_request' || inputs.run_native_build) }}

    env:
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1
        submodules: true

    - name: Set up MSYS2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-iconv
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-python
          mingw-w64-x86_64-uv
          mingw-w64-x86_64-7zip
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-ctags
          mingw-w64-x86_64-diffutils

    - run: uv venv
      shell: msys2 {0}

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt
      shell: msys2 {0}

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg
      with:
        vcpkg-root: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget -PathType Leaf)) {
          throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to add the GitHub Packages NuGet source."
        }

    - name: vcpkg install (x64-mingw-static)
      run: |
        & "${{ env.VCPKG_ROOT }}\vcpkg.exe" install `
          --triplet x64-mingw-static `
          --clean-after-build

  rust-security-audit:
    name: Audit locked Rust dependencies
    runs-on: ubuntu-latest
    needs: check-encoding
    if: ${{ !inputs.release_promotion && (github.event_name != 'pull_request' || inputs.run_native_build) }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1

      - name: Run pinned cargo audit
        shell: bash
        run: |
          set -euo pipefail
          readonly version='0.22.2'
          readonly archive="${RUNNER_TEMP}/cargo-audit-${version}.tgz"
          readonly tool_dir="${RUNNER_TEMP}/cargo-audit-${version}"
          readonly expected_sha256='ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39'
          readonly url="https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${version}/cargo-audit-x86_64-unknown-linux-gnu-v${version}.tgz"

          curl --fail --location --retry 3 --retry-all-errors --output "${archive}" "${url}"
          echo "${expected_sha256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "${tool_dir}"
          tar --extract --gzip --file "${archive}" --directory "${tool_dir}"
          readonly executable="${tool_dir}/cargo-audit-x86_64-unknown-linux-gnu-v${version}/cargo-audit"
          test -x "${executable}"
          "${executable}" audit --file rust/native/Cargo.lock
          "${executable}" audit --file rust/senp/Cargo.lock

  build-chm:
    name: Build CHM
    runs-on: *windows_runner
    needs: check-encoding
    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1
        submodules: true

    # HHC.exeを実行するためにMsBuildが必要
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    # LEProc.exeをインストールするためにAutoHotKeyが必要
    - name: Install AutoHotKey
      run: |
        $AutohotkeyDir = "$HOME\autohotkey"
        if (!(Test-Path $AutohotkeyDir)) { New-Item -ItemType Directory -Path $AutohotkeyDir }
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip -OutFile "AutoHotkey.zip"
        Expand-Archive -Path "AutoHotkey.zip" -DestinationPath $AutohotkeyDir -Force
        echo "AutoHotKey=$HOME\autohotkey\AutoHotkey32.exe" >> $env:GITHUB_ENV

    # HHC.exeを実行するためにLEProc.exeが必要
    - name: Install Locale Emulator
      run: |
        $LEExpandDir = "${{ github.workspace }}\tools\LocaleEmulator"
        $LEInitScript = "${{ github.workspace }}\tools\LocaleEmulator\init-locale-emulator.ahk"
        Expand-Archive "${{ github.workspace }}\externals\LocaleEmulator\locale-emulator.zip" "${LEExpandDir}"
        Start-Process $env:AutoHotKey "${LEInitScript}"
        Start-Process "${LEExpandDir}\LEInstaller.exe"
        echo "${LEExpandDir}" >> $env:GITHUB_PATH

    # HHC.exeを使ってHTMLヘルプをコンパイルする
    - name: Build HTML Help
      run: build-chm.bat
      shell: cmd

    # コンパイルしたHTMLヘルプをartifactにする
    - name: Upload CHM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-chm-artifacts
        path: |
          help/**/*.chm
          help/**/Compile.log
        if-no-files-found: error

  build-bmp-tools:
    name: Build BmpTools
    runs-on: *windows_runner
    needs: check-encoding
    if: ${{ github.event_name != 'pull_request' && !inputs.release_promotion }}

    strategy:
      matrix:
        config:
          - Debug
          - Release

    steps:
    ## see https://github.com/actions/checkout
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 1  # 過去の履歴は含めず取得
        submodules: true

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg
      with:
        vcpkg-root: ${{ env.VCPKG_ROOT }}

    # Toolbar Bitmap Split/Mux
    - name: Build Bitmap Split/Mux
      run: build-bmp-tools.bat ${{ matrix.config }}
      shell: cmd

  build:
    # The type of runner that the job will run on
    name: MSBuild
    runs-on: *windows_runner
    needs: [build-vcpkg-msvc, build-chm]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || inputs.run_native_build) }}

    strategy:
      matrix:
        # A release promotion already validates the source's Debug/Release
        # main gate. It re-runs only the Release package/test path at a fixed
        # source SHA; ordinary CI continues to cover both configurations.
        config: ${{ inputs.release_promotion && fromJSON('["Release"]') || fromJSON('["Debug", "Release"]') }}
        platform:
          - x64

    # SAKURA_GENERATE_ASSEMBLY_LISTINGS makes the product listing branch use
    # /MP off and /CGTHREADS:1. The canonical runner first completes the
    # solution/tests with listings forced off, then rebuilds only the product
    # with listings on. pull_request Release builds never publish the Asm
    # artifact, so leave it off there; push/workflow_dispatch Release builds
    # keep it on for the published Asm zip. Job-level (not step-level) so
    # zipArtifacts.bat and the Upload Asm step below retain the value needed
    # after the two MSBuild phases complete.
    env:
      SAKURA_GENERATE_ASSEMBLY_LISTINGS: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' && '1' || '0' }}
      # No released artifact carries diff.exe, and the archive provider would
      # stage libintl3.dll/libiconv2.dll into the output directory where
      # zipArtifacts.bat copies every *.dll. Pin the provider instead of
      # letting it depend on whether the runner image ships diff on PATH.
      SAKURA_DIFFUTILS_SOURCE: none

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Validate build prerequisites
      env:
        VCPKG_MSVC_RESULT: ${{ needs.build-vcpkg-msvc.result }}
        BUILD_CHM_RESULT: ${{ needs.build-chm.result }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if ($env:VCPKG_MSVC_RESULT -ne 'success') {
          throw "The required vcpkg prerequisite did not succeed: build-vcpkg-msvc=$env:VCPKG_MSVC_RESULT."
        }
        if ($env:EVENT_NAME -ne 'pull_request' -and $env:BUILD_CHM_RESULT -ne 'success') {
          throw "The required CHM prerequisite did not succeed: build-chm=$env:BUILD_CHM_RESULT."
        }

    ## see https://github.com/actions/checkout
    - uses: actions/checkout@v7
      id: checkout
      with:
        ref: ${{ env.CHECKOUT_REF }}
        fetch-depth: 0
        submodules: true

    # Export the shared headless filter for every later step. Every selected
    # native leg runs this complete headless suite.
    - name: Set default headless test filter
      run: Get-Content src/test/headless-suite-selection.env >> $env:GITHUB_ENV

    ## see https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    # ctags.exe now comes from the committed, version-pinned archive that
    # already supplies the shipped license and documentation; diff.exe is not
    # staged at all here. community.chocolatey.org answered 503 during #114 and
    # 504 during #123, failing this required job on an outage it had no reason
    # to depend on.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        activate-environment: true

    - run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

    # The copied trigger event rides the test-results artifact so the
    # workflow_run consumer can attribute the check to the original event.
    - name: Copy github-event.json
      run: |
        Copy-Item "$env:GITHUB_EVENT_PATH" github-event.json

    - name: Setup PR environment variables
      if: github.event_name == 'pull_request'
      run: |
        echo "GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_URL=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_COMMIT=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
        echo "GITHUB_PR_HEAD_SHORT_COMMIT=$('${{ github.event.pull_request.head.sha }}'.SubString(0, 8))" >> $env:GITHUB_ENV

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg
      with:
        vcpkg-root: ${{ env.VCPKG_ROOT }}

    - name: Configure GitHub Packages for vcpkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
        $nuget = & $vcpkg fetch nuget

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget)) {
            throw "Failed to obtain nuget.exe."
        }

        & $nuget sources remove `
            -Name GitHubPackages `
            -NonInteractive 2>$null

        & $nuget sources add `
            -Name GitHubPackages `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "$env:VCPKG_NUGET_OWNER" `
            -Password "$env:GITHUB_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to add the GitHub Packages NuGet source."
        }

    # `package plan` is the same planning pass the restore itself performs
    # first, and it takes under a second.  Running it separately turns the plan
    # hash -- which already covers the declared package set, every declared
    # input digest, both triplets, and the vcpkg tool/toolchain hashes -- into a
    # cache key, so the key changes exactly when the restored closure would.
    - name: Plan the declared package restore
      id: package-plan
      run: |
        $context = "msvc-${{ matrix.platform }}-${{ matrix.config }}".ToLowerInvariant()
        $plan = & py -3 tools/build/sakura_build.py --format json package plan sakura_app --context $context | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) {
          throw "Declared Sakura package planning failed for context $context (exit code $LASTEXITCODE)."
        }

        # A missing or malformed hash must not fail the build: the restore step
        # below still produces a correct closure, just without the cache.
        $hash = ($plan.plan_hash -replace '^sha256:', '')
        if ($hash -notmatch '^[0-9a-f]{64}$') {
          Write-Output "::warning::package plan returned no usable plan hash; restoring without a cache."
          "hash=" >> $env:GITHUB_OUTPUT
          return
        }

        Write-Host "Declared package plan hash: $hash"
        "hash=$hash" >> $env:GITHUB_OUTPUT
        "path=build/pkg/v/e/$hash" >> $env:GITHUB_OUTPUT

    # Restore on every event, save only on trusted pushes -- the same rule
    # cppcheck.yml uses.  A pull-request-scoped entry is readable only by runs
    # on that same `refs/pull/N/merge` ref, so saving one per pull request adds
    # a ~115 MiB entry that nothing else can ever read; 82 such msys2 entries
    # had taken 7.17 GiB of the repository's 10 GiB quota by #123.  Debug and
    # Release resolve to the same plan hash, so one pushed entry serves both
    # matrix jobs and every later pull request that did not change the closure.
    - name: Restore cached package closure
      id: package-cache
      if: ${{ steps.package-plan.outputs.hash != '' }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.package-plan.outputs.path }}
        key: sakura-packages-${{ runner.os }}-${{ steps.package-plan.outputs.hash }}

    # Each hosted build job has its own workspace.  The vcpkg warm-up job
    # publishes binary-cache entries, but cannot provide this job's manifest
    # hashed active package root.  Restore that declared closure explicitly
    # before MSBuild so normal project evaluation never falls back to an
    # implicit/global restore.
    #
    # This step is deliberately unconditional.  A cache hit turns it into the
    # `reused` path, which still validates the restored tree structurally
    # (`complete.json` schema and plan hash, plus `installed/<triplet>/share/`
    # for every declared package) and still reports
    # `native_restore_execution_observed`, so a corrupt or partial entry falls
    # back to a real restore and the explicit-restore evidence contract from
    # #116/#118 holds either way.
    - name: Restore declared Sakura packages
      run: |
        $context = "msvc-${{ matrix.platform }}-${{ matrix.config }}".ToLowerInvariant()
        & py -3 tools/build/sakura_build.py package restore sakura_app --context $context --timeout-seconds 1800
        if ($LASTEXITCODE -ne 0) {
          throw "Declared Sakura package restore failed for context $context (exit code $LASTEXITCODE)."
        }

    - name: Save cached package closure
      if: ${{ github.event_name != 'pull_request' && steps.package-plan.outputs.hash != '' && steps.package-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.package-plan.outputs.path }}
        key: sakura-packages-${{ runner.os }}-${{ steps.package-plan.outputs.hash }}

    # Historic tag sources predate SAKURA_BUILD_SOURCE_SHA and read the
    # runner's GITHUB_SHA directly in version.cmake. Do not attempt to change
    # the protected job environment; shadow it only in the cmd child that
    # builds the immutable checkout.
    - name: MSBuild release promotion
      if: ${{ inputs.release_promotion }}
      env:
        SAKURA_UTF16_BACKEND: cpp
        SAKURA_UTF16_PRODUCTION_PACKAGE: true
      run: |
        set "GITHUB_SHA=${{ env.RELEASE_SOURCE_SHA }}"
        call build-sln.bat ${{ matrix.platform }} ${{ matrix.config }}
      shell: cmd

    - name: MSBuild
      if: ${{ !inputs.release_promotion }}
      env:
        # Rollback-first keeps C++ authoritative while the linked Rust
        # candidate remains available to the focused differential tests.
        SAKURA_UTF16_BACKEND: cpp
        SAKURA_UTF16_PRODUCTION_PACKAGE: true
      run: build-sln.bat ${{ matrix.platform }} ${{ matrix.config }}
      shell: cmd

    - name: Restore CHM artifacts
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/download-artifact@v8
      with:
        name: build-chm-artifacts
        path: help

    # The full native suite opens real windows and is not reliable in a
    # non-interactive hosted-runner session. Keep those tests available for
    # interactive validation and run the documented headless suite in CI.
    #
    - name: Run headless tests
      timeout-minutes: 15
      run: |
        & ctest `
          '--test-dir' 'build/${{ matrix.platform }}/CMakeTools' `
          '-C' '${{ matrix.config }}' `
          '--output-on-failure' `
          '--timeout' '600' `
          '-V'
        if ($LASTEXITCODE -ne 0) {
          throw "ctest failed with exit code $LASTEXITCODE."
        }

    # このジョブは checkout の前に「Validate build prerequisites」を走らせる。
    # そこで失敗するとリポジトリが無いまま always() のこのステップが動き、
    # 「スクリプトが見つからない」という二次エラーだけがログに残って、本当に
    # 落ちたステップが埋もれる。checkout が成功したときだけ動かす。
    - name: Clean up test process survivors
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      run: .\tools\Cleanup-TestProcessSurvivors.ps1

    # Lightweight release-only verification; this does not schedule another clean build.
    - name: Verify release build provenance
      if: ${{ matrix.platform == 'x64' && matrix.config == 'Release' }}
      run: .\tools\verify-build-incremental.ps1 -ValidateImportedFiles

    # The googletest XML plus the copied trigger event feed test-results.yml,
    # the workflow_run consumer that publishes the "Test Results" check.
    - name: Upload test-results artifact
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.platform }}-${{ matrix.config }}
        path: |
          tests*-googletest.xml
          github-event.json
        if-no-files-found: error
        retention-days: 14

    - name: Build installer with Inno Setup
      if: ${{ github.event_name != 'pull_request' }}
      run: build-installer.bat ${{ matrix.platform }} ${{ matrix.config }}
      shell: cmd

    - name: zipArtifacts
      run: zipArtifacts.bat ${{ matrix.platform }} ${{ matrix.config }}
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd

    # The package workspace intentionally contains the immutable release source,
    # which can predate this workflow and therefore cannot supply its own
    # promotion helper. Keep the helper at the trusted workflow revision and in
    # a separate directory so it cannot affect the packaged source tree.
    - name: Checkout release provenance helper
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 1
        path: release-orchestration

    - name: Record release provenance
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: >-
        .\release-orchestration\.github\scripts\Write-ReleaseProvenance.ps1
        -SourceSha "${{ inputs.source_sha }}"
        -ReleaseTag "$env:RELEASE_TAG"
        -OutputPath release-provenance.json

    - name: Upload release provenance
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && inputs.release_promotion }}
      with:
        name: Release provenance ${{ matrix.platform }} ${{ matrix.config }}
        path: release-provenance.json
        if-no-files-found: error

    ## see https://github.com/actions/upload-artifact
    - name: Upload Installer
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Installer ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Installer.zip'

    - name: Upload Exe
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Exe ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Exe.zip'

    - name: Upload Log
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Log ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Log.zip'

    - name: Upload Asm
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && env.SAKURA_GENERATE_ASSEMBLY_LISTINGS == '1' }}
      with:
        name: Asm ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Asm.zip'

    - name: Upload Dev
      uses: actions/upload-artifact@v7
      if: ${{ matrix.config == 'Release' && github.event_name != 'pull_request' }}
      with:
        name: Dev ${{ matrix.platform }} ${{ matrix.config }}
        path: 'sakura-*-Dev.zip'

    - name: Prepare pinned Rust toolchain
      if: ${{ !inputs.release_promotion }}
      working-directory: rust/native
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchainDocument = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
        $senpToolchainDocument = Get-Content -LiteralPath '..\senp\rust-toolchain.toml' -Raw
        $channelMatches = [regex]::Matches(
          $toolchainDocument,
          '(?m)^\s*channel\s*=\s*"([^"]+)"\s*$'
        )
        $senpChannelMatches = [regex]::Matches(
          $senpToolchainDocument,
          '(?m)^\s*channel\s*=\s*"([^"]+)"\s*$'
        )
        if ($channelMatches.Count -ne 1) {
          throw 'rust-toolchain.toml must declare exactly one channel.'
        }
        if ($senpChannelMatches.Count -ne 1) {
          throw 'SENP rust-toolchain.toml must declare exactly one channel.'
        }
        $pin = $channelMatches[0].Groups[1].Value
        $senpPin = $senpChannelMatches[0].Groups[1].Value
        if ($pin -cne $senpPin) {
          throw "Native and SENP must pin the same Rust toolchain release: native=$pin senp=$senpPin"
        }
        if ($pin -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
          throw "rust-toolchain.toml channel must be an exact numeric release, not a moving alias: $pin"
        }
        "RUST_TOOLCHAIN_PIN=$pin" >> $env:GITHUB_ENV
        $toolchainArgument = "+$pin"

        rustup toolchain install $pin --profile minimal --target x86_64-pc-windows-msvc --target wasm32-unknown-unknown --no-self-update
        if ($LASTEXITCODE -ne 0) {
          throw "Pinned Rust toolchain installation failed with exit code $LASTEXITCODE."
        }
        rustup component add rustfmt clippy --toolchain $pin
        if ($LASTEXITCODE -ne 0) {
          throw "Pinned Rust rustfmt/clippy installation failed with exit code $LASTEXITCODE."
        }
        $activeToolchain = (rustup show active-toolchain).Trim()
        if (-not $activeToolchain.StartsWith(
          "$pin-",
          [StringComparison]::Ordinal
        )) {
          throw "rust-toolchain.toml did not select ${pin}: $activeToolchain"
        }
        rustc $toolchainArgument -Vv
        if ($LASTEXITCODE -ne 0) {
          throw "Pinned rustc diagnostics failed with exit code $LASTEXITCODE."
        }

    # One matrix cell owns static Rust analysis; the Debug/Release cells below
    # still run their own locked tests and product staticlib builds.
    - name: Rust static checks (Debug matrix cell)
      if: ${{ !inputs.release_promotion && matrix.config == 'Debug' }}
      working-directory: rust/native
      shell: pwsh
      timeout-minutes: 15
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchainArgument = "+$env:RUST_TOOLCHAIN_PIN"
        cargo $toolchainArgument fmt --all -- --check
        if ($LASTEXITCODE -ne 0) {
          throw "native cargo fmt failed with exit code $LASTEXITCODE."
        }
        cargo $toolchainArgument fmt --manifest-path '..\senp\Cargo.toml' --all -- --check
        if ($LASTEXITCODE -ne 0) {
          throw "SENP cargo fmt failed with exit code $LASTEXITCODE."
        }
        $metadataJson = cargo $toolchainArgument metadata --locked --no-deps --format-version 1
        if ($LASTEXITCODE -ne 0) {
          throw "native cargo metadata failed with exit code $LASTEXITCODE."
        }
        $metadata = $metadataJson | ConvertFrom-Json
        $ffiPackages = @(
          $metadata.packages | Where-Object { $_.name -eq 'sakura-native-ffi' }
        )
        $simdPackages = @(
          $metadata.packages | Where-Object { $_.name -eq 'sakura-simd' }
        )
        $unicodePackages = @(
          $metadata.packages | Where-Object { $_.name -eq 'sakura-unicode-core' }
        )
        if ($ffiPackages.Count -ne 1 -or $simdPackages.Count -ne 1 -or $unicodePackages.Count -ne 1) {
          throw "Native workspace must contain exactly one FFI, SIMD, and Unicode core package."
        }
        $ffiPackage = $ffiPackages[0]
        $simdPackage = $simdPackages[0]
        $unicodePackage = $unicodePackages[0]
        $ffiMemberMatches = @(
          $metadata.workspace_members | Where-Object { $_ -eq $ffiPackage.id }
        )
        $simdMemberMatches = @(
          $metadata.workspace_members | Where-Object { $_ -eq $simdPackage.id }
        )
        $unicodeMemberMatches = @(
          $metadata.workspace_members | Where-Object { $_ -eq $unicodePackage.id }
        )
        if ($ffiMemberMatches.Count -ne 1 -or $simdMemberMatches.Count -ne 1 -or $unicodeMemberMatches.Count -ne 1) {
          throw 'All native crates must be workspace members.'
        }
        $staticlibTargets = @(
          $metadata.packages.targets |
            Where-Object { @($_.crate_types) -contains 'staticlib' }
        )
        if ($staticlibTargets.Count -ne 1) {
          throw "Native workspace must expose exactly one staticlib; matches=$($staticlibTargets.Count)."
        }
        $targets = @($ffiPackage.targets)
        if (
          $targets.Count -ne 1 -or
          ($targets[0].kind -join ',') -ne 'staticlib' -or
          ($targets[0].crate_types -join ',') -ne 'staticlib'
        ) {
          throw 'sakura-native-ffi must be the sole staticlib target.'
        }
        $simdTargets = @($simdPackage.targets)
        if (
          $simdTargets.Count -ne 1 -or
          ($simdTargets[0].kind -join ',') -ne 'lib' -or
          ($simdTargets[0].crate_types -join ',') -ne 'rlib'
        ) {
          throw 'sakura-simd must expose exactly one rlib target.'
        }
        $unicodeTargets = @($unicodePackage.targets)
        if (
          $unicodeTargets.Count -ne 1 -or
          ($unicodeTargets[0].kind -join ',') -ne 'lib' -or
          ($unicodeTargets[0].crate_types -join ',') -ne 'rlib'
        ) {
          throw 'sakura-unicode-core must expose exactly one rlib target.'
        }
        $ffiDependencyNames = @($ffiPackage.dependencies | ForEach-Object { $_.name })
        if (
          $ffiDependencyNames -notcontains 'sakura-simd' -or
          $ffiDependencyNames -notcontains 'sakura-unicode-core'
        ) {
          throw 'sakura-native-ffi must own the final link edges to both native rlibs.'
        }
        cargo $toolchainArgument clippy --workspace --all-targets --all-features --locked -- -D warnings
        if ($LASTEXITCODE -ne 0) {
          throw "native cargo clippy failed with exit code $LASTEXITCODE."
        }
        cargo $toolchainArgument clippy --manifest-path '..\senp\Cargo.toml' --workspace --all-targets --all-features --locked -- -D warnings
        if ($LASTEXITCODE -ne 0) {
          throw "SENP cargo clippy failed with exit code $LASTEXITCODE."
        }

    - name: Rust tests and product staticlib (${{ matrix.config }})
      if: ${{ !inputs.release_promotion }}
      working-directory: rust/native
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchainArgument = "+$env:RUST_TOOLCHAIN_PIN"
        if ('${{ matrix.config }}' -eq 'Release') {
          cargo $toolchainArgument test --workspace --locked --release --no-fail-fast -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "native cargo test (${{ matrix.config }}) failed with exit code $LASTEXITCODE."
          }
          cargo $toolchainArgument test --manifest-path '..\senp\Cargo.toml' --workspace --locked --release --no-fail-fast -- --nocapture
        } else {
          cargo $toolchainArgument test --workspace --locked --no-fail-fast -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "native cargo test (${{ matrix.config }}) failed with exit code $LASTEXITCODE."
          }
          cargo $toolchainArgument test --manifest-path '..\senp\Cargo.toml' --workspace --locked --no-fail-fast -- --nocapture
        }
        if ($LASTEXITCODE -ne 0) {
          throw "SENP cargo test (${{ matrix.config }}) failed with exit code $LASTEXITCODE."
        }
        $profile = if ('${{ matrix.config }}' -eq 'Release') { 'release' } else { 'dev' }
        cargo $toolchainArgument build --package sakura-native-ffi --locked --target x86_64-pc-windows-msvc --profile $profile
        if ($LASTEXITCODE -ne 0) {
          throw "Rust product staticlib ($profile) failed with exit code $LASTEXITCODE."
        }

    - name: Rust candidate integration initialization (cpp production, ${{ matrix.config }})
      if: ${{ !inputs.release_promotion }}
      shell: pwsh
      timeout-minutes: 5
      run: |
        $ErrorActionPreference = 'Stop'
        $test = Join-Path $env:GITHUB_WORKSPACE 'x64\${{ matrix.config }}\tests1.exe'
        $testOutput = & $test '--gtest_filter=CpuDispatchTest.ConcurrentInitializationAndDiagnosticsAreStable' '--gtest_color=no' 2>&1
        $testExitCode = $LASTEXITCODE
        $testOutput | ForEach-Object { Write-Host $_ }
        if ($testExitCode -ne 0) {
          throw "rust initialization diagnostics failed with exit code $testExitCode."
        }
        $summary = $testOutput -join "`n"
        if ($summary -notmatch '\[\s+PASSED\s+\]\s+1\s+test\.') {
          throw 'rust initialization diagnostics did not execute exactly one test.'
        }

    - name: Rust candidate differential tests (cpp production, ${{ matrix.config }})
      if: ${{ !inputs.release_promotion }}
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $test = Join-Path $env:GITHUB_WORKSPACE 'x64\${{ matrix.config }}\tests1.exe'
        $requiredTests = @(
          'CpuDispatchTest.ProcessDispatchIsStable',
          'CpuDispatchTest.DispatchDiagnosticsExposePerOperationBackendAndThresholds',
          'CpuDispatchTest.Utf16ScannersHandleMixedMatchesAndEarliestResult',
          'CpuDispatchTest.RustUtf16ScannersMatchReferenceAtEveryBoundary',
          'CpuDispatchTest.RustUtf16ScannersRejectInvalidFfiSpans',
          'CpuDispatchTest.RustUtf16ScannersMatchEveryLegalAlignment',
          'CpuDispatchTest.RustUtf16ScannersTouchBothGuardPagesAtEveryShortLength',
          'CpuDispatchTest.FindUtf16CharMatchesReferenceAtLengthsAndPositions'
        )
        $listedTests = & $test '--gtest_list_tests' '--gtest_color=no'
        if ($LASTEXITCODE -ne 0) {
          throw "rust gtest inventory failed with exit code $LASTEXITCODE."
        }
        $availableTests = [System.Collections.Generic.HashSet[string]]::new(
          [System.StringComparer]::Ordinal
        )
        $suitePrefix = $null
        foreach ($line in $listedTests) {
          if ($line -match '^(\S.*\.)\s*(?:#.*)?$') {
            $suitePrefix = $Matches[1]
          } elseif ($null -ne $suitePrefix -and $line -match '^\s{2}([^\s#]+)') {
            [void]$availableTests.Add("$suitePrefix$($Matches[1])")
          }
        }
        $missingTests = @(
          $requiredTests | Where-Object { -not $availableTests.Contains($_) }
        )
        if ($missingTests.Count -ne 0) {
          throw "rust focused gtest filter contains missing tests: $($missingTests -join ', ')"
        }
        $filter = $requiredTests -join ':'
        $testOutput = & $test "--gtest_filter=$filter" '--gtest_color=no' 2>&1
        $testExitCode = $LASTEXITCODE
        $testOutput | ForEach-Object { Write-Host $_ }
        if ($testExitCode -ne 0) {
          throw "rust Rust/FFI/dispatch tests failed with exit code $testExitCode."
        }
        $summary = $testOutput -join "`n"
        if ($summary -notmatch "\[\s+PASSED\s+\]\s+$($requiredTests.Count)\s+tests?\.") {
          throw "rust focused gtest run did not report all $($requiredTests.Count) required tests."
        }

    - name: Clean up Rust integration test process survivors
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      run: .\tools\Cleanup-TestProcessSurvivors.ps1

  pr-gate:
    name: Native PR Gate
    runs-on: ubuntu-latest
    needs: [check-encoding, rust-security-audit, build-vcpkg-msvc, build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Verify every selected terminal state
        env:
          CI_PLAN_PROVIDED: ${{ inputs.ci_plan_provided }}
          PLAN_MODE: ${{ inputs.ci_mode }}
          RUN_NATIVE_BUILD: ${{ inputs.run_native_build }}
          ENCODING_RESULT: ${{ needs.check-encoding.result }}
          AUDIT_RESULT: ${{ needs.rust-security-audit.result }}
          VCPKG_RESULT: ${{ needs.build-vcpkg-msvc.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if ($env:CI_PLAN_PROVIDED -ne 'true') {
            throw "Pull-request native work requires a caller-provided CI plan."
          }
          if ($env:ENCODING_RESULT -ne 'success') {
            throw "Encoding check did not succeed: $env:ENCODING_RESULT"
          }

          if ($env:RUN_NATIVE_BUILD -eq 'true') {
            if ($env:AUDIT_RESULT -ne 'success') {
              throw "Selected Rust dependency audit did not succeed: $env:AUDIT_RESULT"
            }
            if ($env:VCPKG_RESULT -ne 'success') {
              throw "Selected vcpkg job did not succeed: $env:VCPKG_RESULT"
            }
            if ($env:BUILD_RESULT -ne 'success') {
              throw "Selected MSBuild matrix did not succeed: $env:BUILD_RESULT"
            }
          }
          elseif ($env:RUN_NATIVE_BUILD -eq 'false' -and $env:PLAN_MODE -eq 'docs_only') {
            $notSelected = -join ('s', 'kipped')
            if ($env:AUDIT_RESULT -ne $notSelected -or $env:VCPKG_RESULT -ne $notSelected -or $env:BUILD_RESULT -ne $notSelected) {
              throw "Documentation-only plan unexpectedly ran native jobs: audit=$env:AUDIT_RESULT vcpkg=$env:VCPKG_RESULT build=$env:BUILD_RESULT"
            }
          }
          else {
            throw "Planner produced an unsupported terminal state: mode=$env:PLAN_MODE native=$env:RUN_NATIVE_BUILD"
          }

          "## PR Gate" >> $env:GITHUB_STEP_SUMMARY
          "- Plan: ``$env:PLAN_MODE``" >> $env:GITHUB_STEP_SUMMARY
          "- Encoding: ``$env:ENCODING_RESULT``" >> $env:GITHUB_STEP_SUMMARY
          "- Rust audit: ``$env:AUDIT_RESULT``" >> $env:GITHUB_STEP_SUMMARY
          "- vcpkg: ``$env:VCPKG_RESULT``" >> $env:GITHUB_STEP_SUMMARY
          "- MSBuild: ``$env:BUILD_RESULT``" >> $env:GITHUB_STEP_SUMMARY
