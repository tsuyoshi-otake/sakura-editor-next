name: Architecture gates

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-gates-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  architecture-gates:
    name: architecture-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify checkout invariance
        run: python3 tools/build/sakura_build.py --format json lint checkout-invariance

      - name: Verify semantic ratchet
        run: python3 tools/build/sakura_build.py --format json inventory semantic --strict

      - name: Verify generated build metadata
        run: python3 tools/build/sakura_build.py generate --check

      - name: Verify component dependency graph
        run: python3 tools/build/sakura_build.py graph check --all-contexts

      - name: Verify dependency ledger
        run: python3 tools/dependency_ledger.py check

      - name: Download pinned TLC tool
        timeout-minutes: 2
        run: |
          curl --fail --location --max-time 60 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"

      - name: Verify Search lifecycle and intentional counterexamples
        timeout-minutes: 5
        run: |
          python3 tools/verify-search-lifecycle.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/search-lifecycle"

      - name: Upload Search lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/search-lifecycle/*.*
          if-no-files-found: error

      - name: Verify SENP GitHub models and gate failures
        timeout-minutes: 15
        run: |
          python3 -m unittest discover -s src/test/py -p test_senp_github_models.py -v
          python3 tools/verify-senp-github-models.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/senp-github"

      - name: Upload SENP GitHub model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: senp-github-models-${{ github.sha }}
          path: |
            ${{ runner.temp }}/senp-github/evidence.json
            ${{ runner.temp }}/senp-github/**/tlc.log
          if-no-files-found: error
