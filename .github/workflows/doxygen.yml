name: Doxygen

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: doxygen-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doxygen:
    runs-on: windows-latest
    strategy:
      matrix:
        BuildPlatform: [x64]
        Configuration: [Release]
    env:
      BuildPlatform: ${{ matrix.BuildPlatform }}
      Configuration: ${{ matrix.Configuration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'

      - name: Set up the locked MSYS2 toolchain
        uses: ./.github/actions/setup-locked-msys2
        with:
          profile: doxygen

      - name: Show environment variables for debug
        run: set
        shell: cmd

      - name: Run doxygen
        run: ./run-doxygen.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}
        shell: msys2 {0}

      - name: Upload doxygen artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_${{ env.BuildPlatform }}_${{ env.Configuration }}
          path: |
            html
            doxygen-${{ env.BuildPlatform }}-${{ env.Configuration }}.log
          if-no-files-found: error
