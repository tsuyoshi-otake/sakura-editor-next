name: PR target policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR target
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate branch direction
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" != "main" ]]; then
            echo "::error::All pull requests must target main."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Only same-repository branches may target main."
            exit 1
          fi

          echo "Accepted main target from same-repository '$HEAD_REF'."
