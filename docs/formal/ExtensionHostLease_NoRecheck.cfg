    p1 = p1
    PIDS = {p1}
    MaxGen = 2
    MaxNested = 2
    CapPerOwner = 4
    QCap = 2
    PinHandles = TRUE
    RecheckAfterPin = FALSE
    ValidateSender = TRUE
INVARIANTS
    TypeOK
    ComponentBalance
    HandleLedger
    QuiescentAttribution
PROPERTIES
    NoForeignLeaseExtension
    GrantsGoToPinnedGeneration
    DeadOwnerLeasesReclaimed
