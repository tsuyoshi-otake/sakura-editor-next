\* Hypothetical design without the tray's second IsRegisteredEditorLeaseOwner
\* check after AcquireLease (RecheckAfterPin = FALSE). TLC is expected to
\* produce a counterexample: the sender dies between the first check and
\* OpenProcess, the PID is recycled, and the grant completes pinned to a
\* bystander process that never requested it.
SPECIFICATION Spec
