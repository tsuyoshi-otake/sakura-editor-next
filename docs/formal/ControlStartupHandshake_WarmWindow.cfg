\* Reachability certificate, NOT a defect demonstration. This runs the
\* production design (SignalAfterReady = TRUE) and asserts the deliberately
\* too-strong invariant WarmImpliesSawTray: "an editor that proceeded
\* because the CP mutex existed had already seen the published tray HWND".
\* TLC is expected to refute it: IsExistControlProcess() returns TRUE from
\* the moment the winning control creates the mutex, long before the
\* platform runtime and tray window exist, so a second editor can proceed
\* with hwndTray still null. The design tolerates this window -- every
\* tray-dependent message fails closed and a real editor is gated by the
\* platform Hello handshake later in startup -- but the window is real, and
\* this configuration keeps TLC proof of exactly where it opens.
SPECIFICATION Spec
CONSTANTS
    l1 = l1
    l2 = l2
    c1 = c1
    c2 = c2
    Launchers = {l1, l2}
    Controls = {c1, c2}
    MaxEvGen = 1
    MaxStandalone = 0
    SignalAfterReady = TRUE
INVARIANTS
    TypeOK
    WarmImpliesSawTray
CHECK_DEADLOCK FALSE
