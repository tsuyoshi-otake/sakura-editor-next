\* Hypothetical design that signals the launcher-ready event as soon as the
\* CP mutex is won (SignalAfterReady = FALSE), before the platform runtime
\* and tray window exist. TLC is expected to produce a counterexample for
\* SignalOnlyAfterTrayPublished: the exact "advertise an intermediate
\* platform state" defect that the comment at CControlProcess.cpp:195-198
\* forbids. LauncherOkImpliesTray is omitted because it is violated by a
\* strictly longer suffix of the same trace and would not fire first.
SPECIFICATION Spec
CONSTANTS
    l1 = l1
    c1 = c1
    c2 = c2
    Launchers = {l1}
    Controls = {c1, c2}
    MaxEvGen = 1
    MaxStandalone = 0
    SignalAfterReady = FALSE
INVARIANTS
    TypeOK
    AtMostOneSurvivor
    MuxConsistency
    EvConsistency
PROPERTIES
    SignalOnlyAfterTrayPublished
    EveryWaitResolves
CHECK_DEADLOCK FALSE
