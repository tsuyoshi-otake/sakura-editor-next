\* Current production design: the ready event is signaled only after the
\* platform runtime is Running and the tray HWND is published. Everything
\* must hold. Deadlock checking is off because launchers and controls have
\* legitimate terminal states.
SPECIFICATION Spec
CONSTANTS
    l1 = l1
    l2 = l2
    c1 = c1
    c2 = c2
    c3 = c3
    Launchers = {l1, l2}
    Controls = {c1, c2, c3}
    MaxEvGen = 2
    MaxStandalone = 1
    SignalAfterReady = TRUE
INVARIANTS
    TypeOK
    AtMostOneSurvivor
    MuxConsistency
    EvConsistency
PROPERTIES
    SignalOnlyAfterTrayPublished
    LauncherOkImpliesTray
    EveryWaitResolves
CHECK_DEADLOCK FALSE
