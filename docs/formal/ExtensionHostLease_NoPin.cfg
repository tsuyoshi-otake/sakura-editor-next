\* Hypothetical legacy design: liveness is re-derived from the numeric PID
\* instead of the pinned process object (PinHandles = FALSE). TLC is
\* expected to produce a counterexample: after die -> PID recycle, the old
\* lease survives and the recycled process extends it (ABA).
\*
\* QuiescentAttribution is deliberately left out here: it is violated by a
\* shorter prefix of the same defect (a dead owner's residual lease gets
\* re-attributed to the recycled live process), which would mask the more
\* instructive NoForeignLeaseExtension counterexample below.
SPECIFICATION Spec
CONSTANTS
    p1 = p1
    PIDS = {p1}
    MaxGen = 2
    MaxNested = 2
    CapPerOwner = 4
    QCap = 2
    PinHandles = FALSE
    RecheckAfterPin = TRUE
    ValidateSender = TRUE
INVARIANTS
    TypeOK
    ComponentBalance
    HandleLedger
PROPERTIES
    NoForeignLeaseExtension
    GrantsGoToPinnedGeneration
    DeadOwnerLeasesReclaimed
